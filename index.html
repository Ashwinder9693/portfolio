<!doctype html>
<html lang="en">
  <head>
    <!-- Fonts: Teko (for your name) + Playfair for optional subtitle -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ashwinder Bhupal — Software Developer</title>
    <meta name="description" content="Ashwinder Bhupal — Software Developer, CS student at Rutgers University and Princeton Transfer Scholar. Building full-stack apps and AI research.">
    <meta property="og:title" content="Ashwinder Bhupal — Software Developer">
    <meta property="og:description" content="Portfolio of Ashwinder Bhupal — full-stack developer and AI researcher.">
    <meta property="og:url" content="https://ashwinderbhupal.com">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://ashwinderbhupal.com">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./Static/logo.svg" />

    <!-- Critical CSS (intro + app cross-fade) -->
    <style>
      /* Host app cross-fade */
      .app-viewport{
        opacity:0;
        transition:opacity .8s ease;            /* sync with FADE_DURATION */
        min-height:100vh; min-height:100dvh;    /* mobile-safe height */
      }
      .app-viewport.visible{ opacity:1; }

      /* Intro overlay */
      .intro-screen{
        position:fixed; inset:0;
        background:radial-gradient(125% 125% at 50% 38%, #15161a 0%, #0b0b0d 55%, #000 100%);
        display:grid; place-items:center;
        z-index:10000; opacity:1; transition:opacity .8s ease;
      }
      .intro-screen.fade-out{ opacity:0; }
      .intro-content{
        text-align:center; padding:0 24px;
        display:flex; flex-direction:column; align-items:center;
      }

      /* Logo (steady, refined edge glow) */
      .intro-logo-wrap{ position:relative; display:inline-block; margin-bottom:16px; }
      .intro-logo{
        width:104px; height:auto; opacity:0;
        transform:translateY(6px) scale(.98);
        transition:opacity 700ms ease, transform 700ms ease;
        filter:
          drop-shadow(0 0 9px rgba(255,255,255,.50))
          drop-shadow(0 0 20px rgba(255,255,255,.28));
      }
      .intro-screen.active .intro-logo{ opacity:1; transform:translateY(0) scale(1); }

      /* Name */
      .intro-text{
        margin-top:2px; opacity:0; transform:translateY(10px);
        transition:opacity 700ms ease 250ms, transform 700ms ease 250ms;
      }
      .intro-screen.active .intro-text{ opacity:1; transform:translateY(0); }

      .intro-title{
        font-family:"Teko", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        font-weight:600;
        letter-spacing:.10em;
        font-size:clamp(2rem, 5vw, 3rem);
        color:#fff;
        text-transform:uppercase;
        line-height:1;
      }

      /* Role / credential line */
      .intro-subtitle{
        margin-top:8px;
        font-family:ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        font-size:.72rem; letter-spacing:.28em; text-transform:uppercase;
        color:rgba(255,255,255,.55);
        opacity:0; transform:translateY(8px);
        transition:opacity 700ms ease 450ms, transform 700ms ease 450ms;
      }
      .intro-screen.active .intro-subtitle{ opacity:1; transform:translateY(0); }
      .intro-subtitle .dot{ color:#7c8cff; padding:0 6px; }

      /* Divider */
      .intro-rule{
        width:0; height:1px; margin-top:20px;
        background:linear-gradient(90deg, transparent, rgba(255,255,255,.28), transparent);
        transition:width 900ms ease 600ms;
      }
      .intro-screen.active .intro-rule{ width:min(340px, 68vw); }

      /* Deliberate loading bar */
      .intro-progress{
        margin-top:26px; width:min(200px, 56vw); height:2px;
        background:rgba(255,255,255,.12); border-radius:2px; overflow:hidden;
        opacity:0; transition:opacity 500ms ease 550ms;
      }
      .intro-screen.active .intro-progress{ opacity:1; }
      .intro-progress-bar{
        display:block; height:100%; width:0;
        background:linear-gradient(90deg, #7c8cff, #c084fc);
        border-radius:2px;
      }
      .intro-screen.active .intro-progress-bar{
        width:100%;
        transition:width 2000ms cubic-bezier(.65,.05,.36,1) 300ms;
      }

      /* Respect reduced motion */
      @media (prefers-reduced-motion: reduce){
        .intro-logo,
        .intro-text,
        .intro-subtitle,
        .intro-rule,
        .intro-progress,
        .intro-progress-bar{ transition:none!important; transform:none!important; }
        .intro-screen.active .intro-progress-bar{ width:100%; }
        .intro-screen.active .intro-rule{ width:min(340px,68vw); }
      }
    </style>
  </head>

  <body>
    <!-- App wrapper so we can fade the app in while intro fades out -->
    <div id="app-viewport" class="app-viewport">
      <div id="root"></div>
    </div>

    <!-- Intro overlay -->
    <div id="intro" class="intro-screen">
      <div class="intro-content">
        <div class="intro-logo-wrap">
          <img class="intro-logo" src="./Static/logo.svg" alt="Logo">
        </div>

        <div class="intro-text">
          <span class="intro-title">Ashwinder&nbsp;Bhupal</span>
        </div>

        <div class="intro-subtitle">
          Software&nbsp;Developer<span class="dot">·</span>Rutgers&nbsp;CS<span class="dot">·</span>Princeton&nbsp;Scholar
        </div>

        <div class="intro-rule"></div>

        <div class="intro-progress"><span class="intro-progress-bar"></span></div>
      </div>
    </div>

    <!-- Your app entry (Vite dev). In production, Vite replaces this with the built asset. -->
    <script type="module" src="./src/main.jsx"></script>

    <!-- Intro logic (with mobile/iOS-safe fallback) -->
    <script>
      // Timings
      const HOLD = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 900 : 2000;
      const FADE_DURATION = 800; // must match CSS .8s

      const intro = document.getElementById('intro');
      const appViewport = document.getElementById('app-viewport');

      let backupTimer;

      function startIntro() {
        intro.classList.add('active');
        // safety: if 'load' is slow or never fires on some mobile cases,
        // force-finish after a max window
        backupTimer = setTimeout(endIntro, HOLD + 2500);
      }

      function endIntro() {
        if (!intro) return;
        appViewport.classList.add('visible');   // app fades IN
        intro.classList.add('fade-out');        // intro fades OUT
        setTimeout(() => {
          if (intro && intro.parentNode) intro.parentNode.removeChild(intro);
        }, FADE_DURATION + 50);
        clearTimeout(backupTimer);
      }

      // Start as soon as DOM is ready
      window.addEventListener('DOMContentLoaded', startIntro, { once: true });

      // Normal path: wait a short hold after all assets are loaded
      window.addEventListener('load', () => {
        setTimeout(endIntro, HOLD);
      }, { once: true });

      // bfcache / back-forward cache on iOS Safari
      window.addEventListener('pageshow', (e) => {
        if (e.persisted) endIntro();
      });
    </script>
  </body>
</html>
